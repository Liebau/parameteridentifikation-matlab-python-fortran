name: Tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install Python package
        run: python -m pip install -e ./python
      - name: Run Python tests
        run: python -m unittest discover -s python/tests -v

  fortran:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install compiler, BLAS and LAPACK
        run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev
      - name: Install Python reference
        run: python -m pip install -e ./python
      - name: Configure and build Fortran
        run: cmake -S fortran -B fortran/build -DCMAKE_BUILD_TYPE=Release
      - name: Run Fortran and cross-language tests
        run: cmake --build fortran/build --parallel && ctest --test-dir fortran/build --output-on-failure
